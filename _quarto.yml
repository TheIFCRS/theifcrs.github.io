             text: Past Meetings
      - href: membership/index.qmd
        text: Membership
      - href: news/index.qmd
        text: News
      - href: gallery/index.qmd
        text: Gallery
      - href: resources/index.qmd
        text: Resources
      - href: proceedings/index.qmd
        text: Proceedings
      - text: "{{< iconify fa6-brands:bluesky >}}"
