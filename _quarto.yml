  navbar:
    title: "The International Fossil Coral and Reef Society"
    logo: "/_img/logo.png"
    pinned: true
    right:
      - text: About
        menu:
           - href: about/council/index.qmd
             text: Council
           - href: about/statute/index.qmd
             text: Statue
           - href: about/history/index.qmd
             text: History
      - text: Meetings
        menu:
           - href: meetings/ecrs/index.qmd
